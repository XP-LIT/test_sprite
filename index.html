<!DOCTYPE html>
<html lang="en">
<head>
    <title>XP_LIT Viewer</title>
    <meta property="og:description" content="Geocode with Nominatim and the maplibre-gl-geocoder plugin." />
    <meta property="og:category" content="Plugins & Integrations" />
    <meta property="og:order" content="1" />
    <meta property="og:created" content="2025-06-25" />
    <meta charset='utf-8'>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <!-- MapLibre GL JS CSS -->
    <link rel='stylesheet' href='https://unpkg.com/maplibre-gl@6.13.0/dist/maplibre-gl.css' />
    <!-- MapLibre GL Geocoder CSS -->
    <link rel="stylesheet" href="https://unpkg.com/@maplibre/maplibre-gl-geocoder@1.5.0/dist/maplibre-gl-geocoder.css" />

    <style>
        body { margin: 0; padding: 0; }
        html, body, #map { height: 100%; }
    </style>
</head>
<body>

<!-- Load the `maplibre-gl-geocoder` plugin script -->
<script src="https://unpkg.com/@maplibre/maplibre-gl-geocoder@1.5.0/dist/maplibre-gl-geocoder.min.js"></script>

<div id="map"></div>

<script type="module">
    import * as maplibregl from 'https://unpkg.com/maplibre-gl@6.13.0/dist/maplibre-gl.mjs';

    // 1. Karte initialisieren mit dem XP_LIT Style
    const map = new maplibregl.Map({
        container: 'map',
        style: 'https://raw.githubusercontent.com/XP-LIT/test_sprite/refs/heads/main/style.json',
        center: [-0.0005, 51.4768],
        zoom: 12,
        minZoom: 6,
        maxZoom: 16,
        pitch: 0,
        bearing: 0,
        canvasContextAttributes: { antialias: true }
    });

    // 2. Navigations-Steuerung (Zoom, Kompass) oben rechts hinzufügen
    const nav = new maplibregl.NavigationControl({
        showZoom: true,
        showCompass: true
    });
    map.addControl(nav, 'top-right');

    // 3. Nominatim API-Schnittstelle für den Geocoder definieren
    const geocoderApi = {
        forwardGeocode: async (config) => {
            const features = [];
            try {
                const request = `https://openstreetmap.org{encodeURIComponent(config.query)}&format=geojson&polygon_geojson=1&addressdetails=1`;
                
                const response = await fetch(request, {
                    headers: {
                        'User-Agent': 'XP-LIT-MapLibre-Viewer'
                    }
                });
                const geojson = await response.json();
                
                for (const feature of geojson.features) {
                    const center = [
                        feature.bbox[0] + (feature.bbox[2] - feature.bbox[0]) / 2,
                        feature.bbox[1] + (feature.bbox[3] - feature.bbox[1]) / 2
                    ];
                    
                    const bounds = [
                        feature.bbox[0],
                        feature.bbox[1],
                        feature.bbox[2],
                        feature.bbox[3]
                    ];
                    
                    const point = {
                        type: 'Feature',
                        geometry: {
                            type: 'Point',
                            coordinates: center
                        },
                        place_name: feature.properties.display_name,
                        properties: feature.properties,
                        text: feature.properties.display_name,
                        place_type: ['place'],
                        center: center,
                        bbox: bounds
                    };
                    features.push(point);
                }
            } catch (e) {
                console.error(`Failed to forwardGeocode with error: ${e}`);
            }

            return {
                features
            };
        }
    };

    map.addControl(
        new MaplibreGeocoder(geocoderApi, {
            maplibregl: maplibregl,
            placeholder: 'Search...',
            fitBoundsOptions: {
                padding: 40,
                maxZoom: 16
            }
        }),
        'top-left'
    );
</script>
</body>
</html>
