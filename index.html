<!DOCTYPE html>

<html>

<head>

  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.1/dist/maplibre-gl.js"></script>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.1/dist/maplibre-gl.css" />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@maptoolkit/maplibre-logo-control@1.1.2/dist/maplibre-logo-control.css" />

  <script src="https://cdn.jsdelivr.net/npm/@maplibre/maplibre-gl-geocoder@1.2.0/dist/maplibre-gl-geocoder.min.js"></script>

  <link href="https://cdn.jsdelivr.net/npm/@maplibre/maplibre-gl-geocoder@1.2.0/dist/maplibre-gl-geocoder.css" rel="stylesheet" />

  <style>

    html, body { width: 100%; height: 100%; margin: 0; padding: 0; }

    #map { width: 100%; height: 100%; }

  </style>

</head>

<body>

  <div id="map"></div>

  <script>

    let map = new maplibregl.Map({

      container: "map",

      attributionControl: { compact: false },

      style: 'https://raw.githubusercontent.com/XP-LIT/test_sprite/refs/heads/main/style.json',
      center: [-0.0005, 51.4768],
      zoom: 12,
      minZoom: 9,
	    maxZoom: 16,

    });



    map.addControl(

      new MaplibreGeocoder({

        forwardGeocode: async (cfg) => {

          const response = await fetch(

            `https://geocoder.maptoolkit.net/search?q=${encodeURIComponent(cfg.query)}&language=${cfg.language[0]}&api_key=YOUR_API_KEY`

          );

          const result = await response.json();

          return {

            features: result.map((e) => ({

              type: "Feature",

              geometry: { type: "Point", coordinates: [e.lon, e.lat] },

              place_type: ["place"],

              place_name: e.display_name,

              text: e.type,

              properties: e,

              center: [e.lon, e.lat]

            }))

          };

        },

      }, {

        showResultsWhileTyping: true,

        showResultMarkers: false,

        maplibregl: maplibregl

      })

    );

  </script>

  <script type="module">

    import { LogoControl } from "https://cdn.jsdelivr.net/npm/@maptoolkit/maplibre-logo-control@1.1.2/dist/maplibre-logo-control.js";

    map.addControl(new LogoControl({ variant: "com" }));

  </script>

</body>

</html>
