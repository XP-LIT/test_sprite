<!DOCTYPE html>
<html lang="en">
<head>
    <title>Display a map</title>
    <meta property="og:description" content="Initialize a map in an HTML element with MapLibre GL JS." />
    <meta property="og:category" content="Getting Started" />
    <meta property="og:order" content="1" />
    <meta property="og:created" content="2025-06-25" />
    <meta charset='utf-8'>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel='stylesheet' href='https://unpkg.com/maplibre-gl@6.13.0/dist/maplibre-gl.css' />

    <style>
        body { margin: 0; padding: 0; }
        html, body, #map { height: 100%; }
    </style>
</head>
<body>
<div id="map"></div>
<script type="module">
    import * as maplibregl from 'https://unpkg.com/maplibre-gl@6.13.0/dist/maplibre-gl.mjs';

    const map = new maplibregl.Map({
        container: 'map', // container id
        style: 'https://raw.githubusercontent.com/XP-LIT/test_sprite/refs/heads/main/style.json', // style URL
        center: [-0.0005, 51.4768], // starting position [lng, lat]
        zoom: 12, // starting zoom
        minZoom: 10,
	maxZoom: 16,
        maplibreLogo: false
    });
</script>
</body>
</html>
